version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: habos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: habos_user
      POSTGRES_PASSWORD: habos_password
      POSTGRES_DB: habos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: habos_api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://habos_user:habos_password@postgres:5432/habos_db?schema=public"
      PORT: 5000
      JWT_SECRET: "your_super_secret_jwt_key_here"
    ports:
      - "5000:5000"
    depends_on:
      - postgres

volumes:
  pgdata:
