version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: habos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: habos_user
      POSTGRES_PASSWORD: habos_password
      POSTGRES_DB: habos_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habos_user -d habos_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: habos_api
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://habos_user:habos_password@postgres:5432/habos_db?schema=public"
      PORT: 5000
      JWT_SECRET: "${JWT_SECRET:-habos_production_super_secret_jwt_access_signing_key_2026_x99}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-habos_production_super_secret_jwt_refresh_signing_key_2026_x99}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-384114652753-543grsegq0dj2blns4mmjeu369r4ifqb.apps.googleusercontent.com}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-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}"
      GOOGLE_CALLBACK_URL: "${GOOGLE_CALLBACK_URL:-http://localhost:5000/api/v1/auth/google/callback}"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
